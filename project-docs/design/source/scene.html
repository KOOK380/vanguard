// One mesh per material per group, so that a zone can be highlighted as a unit and draw calls stay low.
function bake(root) {
  root.updateMatrixWorld(true);
  const out = G(); out.name = root.name;
  const inv = new THREE.Matrix4().copy(root.matrixWorld).invert();
  const walk = (src, dest) => {
    const buckets = new Map(), pending = [];
    const collect = o => { for (const c of o.children) { if (c.isMesh) { const g = c.geometry.clone(); g.applyMatrix4(new THREE.Matrix4().multiplyMatrices(inv, c.matrixWorld)); const n = g.index ? g.toNonIndexed() : g; for (const a of Object.keys(n.attributes)) if (a !== 'position' && a !== 'normal') n.deleteAttribute(a); (buckets.get(c.material) || buckets.set(c.material, []).get(c.material)).push(n); if (c.children.length) collect(c); } else if (c.isGroup && c.name) pending.push(c); else if (c.isGroup) collect(c); else if (c.name) { const a = new THREE.Object3D(); a.name = c.name; a.position.copy(c.position); a.userData = c.userData; dest.add(a); } } };
    collect(src);
    for (const [mat, list] of buckets) { const m = new THREE.Mesh(mergeGeometries(list, false), mat); m.name = dest.name + '-' + mat.name.replace('vt-', ''); dest.add(m); }
    for (const c of pending) { const g = G(); g.name = c.name; dest.add(g); walk(c, g); }
  };
  for (const c of root.children) { const g = G(); g.name = c.name; out.add(g); walk(c, g); }
  return out;
}

window.exportModel = async which => {
  Object.assign(Q, LOW);
  const baked = bake(which === 'hero' ? heroModel() : plantModel());
  let tris = 0, draws = 0; baked.traverse(o => { if (o.isMesh) { tris += o.geometry.attributes.position.count / 3; draws++; } });
  const buf = await new Promise((res, rej) => new GLTFExporter().parse(baked, res, rej, { binary: true }));
  let bin = ''; const u = new Uint8Array(buf); for (let i = 0; i < u.length; i += 32768) bin += String.fromCharCode.apply(null, u.subarray(i, i + 32768));
  return { b64: btoa(bin), tris, draws };
};

window.renderGlb = async (file, opts, samples = 128) => {
  const loader = new GLTFLoader(); loader.setMeshoptDecoder(MeshoptDecoder);
  const g = await new Promise((res, rej) => loader.load(file, res, null, rej));
  const root = g.scene, names = [], anchors = {}; let tris = 0, draws = 0;
  root.updateMatrixWorld(true);
  root.traverse(o => { if (o.isMesh) { o.castShadow = o.receiveShadow = true; draws++; tris += (o.geometry.index ? o.geometry.index.count : o.geometry.attributes.position.count) / 3; } else if (o.name) { names.push(o.name); } if (o.name && o.name.startsWith('hotspot-')) anchors[o.name] = { p: o.getWorldPosition(new THREE.Vector3()).toArray(), extras: o.userData }; });
  const wrap = G(); wrap.add(root); wrap.userData.floorY = opts.floorY;
  const cv = await render(wrap, opts);
  const spots = Object.entries(anchors).map(([n, a]) => { const v = new THREE.Vector3(...a.p).project(window.lastCam); return { name: n, label: a.extras.label, page: a.extras.page, x: +(((v.x + 1) / 2) * 100).toFixed(1), y: +(((1 - v.y) / 2) * 100).toFixed(1) }; });
  return { large: encode(cv, opts.largeW || 1400), small: encode(cv, 780, .8), names, tris, draws, spots };
};
